  location: Urbana, IL
  image: ""
  summary: >
    Electrical engineering student at the University of Illinois Urbana-Champaign, finishing a B.S. in December 2026.
    Most of my work sits on the line between hardware and software: bringing up an OS kernel on bare-metal RISC-V,
    building FPGA systems in SystemVerilog, profiling CUDA kernels, and designing high-voltage PCBs. Alongside that
    I co-founded a quantitative trading project and live-deployed a statistical-arbitrage framework with real money
    behind it. I like understanding a system all the way down and being honest about where it works and where it does
    not. U.S. citizen, eligible for clearance.

